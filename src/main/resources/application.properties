spring.application.name=ecommerce-oims
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ecom_oims?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=oims_app
spring.datasource.password=Oims@2026dev
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - tables are created from database/schema.sql, hibernate only checks them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# JSP views
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# page size used by listing pages
app.page-size=8

# keep jsessionid out of the URLs
server.servlet.session.tracking-modes=cookie
